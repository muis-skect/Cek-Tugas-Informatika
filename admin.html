<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin & Kelola Data - Cek Tugas</title>
    <style>
        :root { --primary-blue: #4a76c5; }
        body { font-family: 'Segoe UI', sans-serif; background: #e9ecef; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 90vh; }
        
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 100%; max-width: 400px; text-align: center; margin-top: 50px; }
        .admin-container { display: none; width: 100%; max-width: 1000px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        h2 { color: var(--primary-blue); margin-bottom: 15px; }
        input[type="password"], input[type="text"], .search-box { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        .btn-action { background: var(--primary-blue); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        .btn-edit { background: #ffc107; color: #222; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 4px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
        th { background-color: var(--primary-blue); color: white; }
        tr:hover { background-color: #f1f1f1; }
        .nav-link { display: inline-block; margin-bottom: 15px; color: var(--primary-blue); text-decoration: none; font-weight: bold; }
        
        /* Modal Popup Form */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Form Login Admin -->
    <div id="loginBox" class="login-card">
        <h2>LOGIN ADMIN</h2>
        <p>Masukkan Kata Sandi Admin</p>
        <input type="password" id="passInput" placeholder="Masukkan Password Admin...">
        <button class="btn-action" onclick="checkPassword()">MASUK</button>
        <br><br>
        <a href="index.html" style="color: #666; text-decoration: none; font-size: 0.85rem;">&larr; Kembali ke Pemindai Scan</a>
    </div>

    <!-- Panel Admin & CRUD Data -->
    <div id="adminPanel" class="admin-container">
        <a href="index.html" class="nav-link">&larr; Kembali ke Pemindai Scan</a>
        
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:15px;">
            <h2>KELOLA DATA & TUGAS SISWA</h2>
            <button class="btn-add" onclick="openModal('add')">+ Tambah Data Siswa</button>
        </div>

        <input type="text" id="searchInput" class="search-box" onkeyup="filterData()" placeholder="Cari Berdasarkan Nama, NISN, atau Kelas...">
        
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NISN</th>
                    <th>Nama Siswa</th>
                    <th>Kelas</th>
                    <th>Daftar Tugas</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Form (Tambah/Edit) -->
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0;">Tambah Data Siswa</h3>
            <input type="hidden" id="formRowIndex">
            
            <label><strong>NISN / Kode Barcode:</strong></label>
            <input type="text" id="formNisn" placeholder="Contoh: 12345678">

            <label><strong>Nama Siswa:</strong></label>
            <input type="text" id="formNama" placeholder="Nama Lengkap Siswa">

            <label><strong>Kelas:</strong></label>
            <input type="text" id="formKelas" placeholder="Contoh: IX-A">

            <label><strong>Daftar Tugas (Pisahkan dengan koma):</strong></label>
            <input type="text" id="formTugas" placeholder="Contoh: Matematika Bab 1, IPA Praktikum">

            <div class="modal-buttons">
                <button class="btn-action" onclick="saveData()">Simpan Data</button>
                <button style="background:#6c757d; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer;" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // URL Apps Script Aktif
        const API_URL = 'https://script.google.com/macros/s/AKfycbxDqgKywle5IRa2pWxFQib_yjQftqlS8ie0VOnkEnEDVGh_TAQUBrWAsbhdS6pwmK6LEg/exec';

        let listSiswa = [];

        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            if (pass === 'admin123') { // Password Default Admin
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadData();
            } else {
                alert('Password Salah!');
            }
        }

        function loadData() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    listSiswa = data;
                    renderTable(listSiswa);
                })
                .catch(err => {
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Gagal memuat data dari database.</td></tr>';
                });
        }

        function renderTable(data) {
            let html = "";
            if (data.length === 0) {
                html = '<tr><td colspan="6" style="text-align:center;">Data tidak ditemukan.</td></tr>';
            } else {
                data.forEach((item, index) => {
                    html += `<tr>
                        <td>${index + 1}</td>
                        <td>${item.nisn}</td>
                        <td><b>${item.nama}</b></td>
                        <td>${item.kelas}</td>
                        <td>${item.tugas || '<span style="color:green; font-weight:bold;">Semua Selesai</span>'}</td>
                        <td>
                            <button class="btn-edit" onclick="openModal('edit', ${index})">Edit</button>
                            <button class="btn-delete" onclick="deleteData(${item.rowIndex})">Hapus</button>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById('tableBody').innerHTML = html;
        }

        function openModal(mode, index = null) {
            document.getElementById('dataModal').style.display = 'flex';
            if (mode === 'add') {
                document.getElementById('modalTitle').innerText = 'Tambah Data Siswa';
                document.getElementById('formRowIndex').value = '';
                document.getElementById('formNisn').value = '';
                document.getElementById('formNama').value = '';
                document.getElementById('formKelas').value = '';
                document.getElementById('formTugas').value = '';
            } else {
                const item = listSiswa[index];
                document.getElementById('modalTitle').innerText = 'Edit Data & Tugas Siswa';
                document.getElementById('formRowIndex').value = item.rowIndex;
                document.getElementById('formNisn').value = item.nisn;
                document.getElementById('formNama').value = item.nama;
                document.getElementById('formKelas').value = item.kelas;
                document.getElementById('formTugas').value = item.tugas;
            }
        }

        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        function saveData() {
            const rowIndex = document.getElementById('formRowIndex').value;
            const nisn = document.getElementById('formNisn').value;
            const nama = document.getElementById('formNama').value;
            const kelas = document.getElementById('formKelas').value;
            const tugas = document.getElementById('formTugas').value;

            if (!nisn || !nama || !kelas) {
                alert('NISN, Nama, dan Kelas wajib diisi!');
                return;
            }

            const payload = {
                action: rowIndex ? 'edit' : 'add',
                rowIndex: rowIndex ? parseInt(rowIndex) : null,
                nisn: nisn,
                nama: nama,
                kelas: kelas,
                tugas: tugas
            };

            document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;">Menyimpan perubahan ke Google Sheets...</td></tr>';
            closeModal();

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                loadData();
            })
            .catch(err => {
                alert('Gagal menyimpan data.');
                loadData();
            });
        }

        function deleteData(rowIndex) {
            if (confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center;">Menghapus data...</td></tr>';
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
                })
                .then(res => res.json())
                .then(res => {
                    alert(res.message);
                    loadData();
                })
                .catch(err => {
                    alert('Gagal menghapus data.');
                    loadData();
                });
            }
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = listSiswa.filter(item => 
                item.nama.toLowerCase().includes(query) ||
                item.nisn.toLowerCase().includes(query) ||
                item.kelas.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>
